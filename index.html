<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công Cụ Điểm Danh Học Sinh</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="firebase-config.js" defer></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Công Cụ Điểm Danh Học Sinh</h1>

        <!-- Truy vấn học sinh -->
        <div class="section">
            <h2>Truy Vấn Lịch Sử Điểm Danh</h2>
            <input type="text" id="queryStudentName" placeholder="Nhập tên học sinh">
            <div>
                Ngày Bắt Đầu: <input type="date" id="startDate">
                Ngày Kết Thúc: <input type="date" id="endDate">
            </div>
            <button id="queryByNameAndDateButton">Truy Vấn Học Sinh</button>
        </div>

        <!-- Kết quả truy vấn -->
        <div class="section">
            <h2>Kết Quả Truy Vấn</h2>
            <div id="loadingIndicator" style="display: none;">Đang tải dữ liệu...</div>
            <div id="noDataMessage" style="display: none;">Không tìm thấy dữ liệu.</div>
            <div id="attendanceResultContainer">
                <table>
                    <thead>
                        <tr>
                            <th>Tên Học Sinh</th>
                            <th>Ngày</th>
                            <th>Giờ</th>
                            <th>Môn Học</th>
                            <th>Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceResult">
                        <!-- Dữ liệu sẽ được thêm vào đây -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Xuất file Excel -->
        <div class="section">
            <h2>Xuất File Excel</h2>
            <button id="exportButton">Xuất ra Excel</button>
        </div>
    </div>
</body>
</html>
