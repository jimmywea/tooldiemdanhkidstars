<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Điểm Danh - Thiết Kế Mới</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="firebase-config.js" defer></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="app-header">
            <h1>Quản Lý Điểm Danh</h1>
        </header>

        <!-- Menu chức năng -->
        <nav class="app-menu">
            <button id="queryButton" class="menu-item active">Truy Vấn</button>
            <button id="exportButton" class="menu-item">Xuất Dữ Liệu</button>
        </nav>

        <!-- Nội dung chính -->
        <main class="app-content">
            <!-- Truy vấn -->
            <section id="querySection" class="section active">
                <h2>Truy Vấn Lịch Sử</h2>
                <div class="form-group">
                    <label for="queryStudentName">Tên Học Sinh</label>
                    <input type="text" id="queryStudentName" placeholder="Nhập tên học sinh">
                </div>
                <div class="form-group">
                    <label for="startDate">Ngày Bắt Đầu</label>
                    <input type="date" id="startDate">
                </div>
                <div class="form-group">
                    <label for="endDate">Ngày Kết Thúc</label>
                    <input type="date" id="endDate">
                </div>
                <button id="runQueryButton" class="btn primary">Truy Vấn</button>
            </section>

            <!-- Kết quả -->
            <section id="resultSection" class="section">
                <h2>Kết Quả Truy Vấn</h2>
                <div id="loadingIndicator" class="loading" style="display: none;">Đang tải dữ liệu...</div>
                <div id="noDataMessage" class="no-data" style="display: none;">Không tìm thấy dữ liệu.</div>
                <div id="resultContainer" class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Tên Học Sinh</th>
                                <th>Ngày</th>
                                <th>Giờ</th>
                                <th>Môn Học</th>
                                <th>Trạng Thái</th>
                            </tr>
                        </thead>
                        <tbody id="resultTable">
                            <!-- Dữ liệu sẽ được thêm vào đây -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Xuất dữ liệu -->
            <section id="exportSection" class="section">
                <h2>Xuất Dữ Liệu</h2>
                <button id="runExportButton" class="btn success">Xuất ra Excel</button>
            </section>
        </main>
    </div>
</body>
</html>
