<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Điểm Danh</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="firebase-config.js" defer></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Quản Lý Điểm Danh</h1>
        </header>

        <!-- Truy vấn học sinh -->
        <div class="section">
            <h2>Truy Vấn Lịch Sử Điểm Danh</h2>
            <input type="text" id="queryStudentName" placeholder="Nhập tên học sinh">
            <div class="date-range">
                <label>
                    Ngày Bắt Đầu:
                    <input type="date" id="startDate">
                </label>
                <label>
                    Ngày Kết Thúc:
                    <input type="date" id="endDate">
                </label>
            </div>
            <button id="queryButton" class="btn">Truy Vấn</button>
        </div>

        <!-- Kết quả truy vấn -->
        <div class="section">
            <h2>Kết Quả</h2>
            <div id="loadingIndicator" class="loading" style="display: none;">Đang tải dữ liệu...</div>
            <div id="noDataMessage" class="no-data" style="display: none;">Không tìm thấy dữ liệu.</div>
            <div id="resultContainer" class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Tên Học Sinh</th>
                            <th>Ngày</th>
                            <th>Giờ</th>
                            <th>Môn Học</th>
                            <th>Trạng Thái</th>
                        </tr>
                    </thead>
                    <tbody id="resultTable">
                        <!-- Dữ liệu sẽ được thêm vào đây -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Xuất file Excel -->
        <div class="section">
            <h2>Xuất Dữ Liệu</h2>
            <button id="exportButton" class="btn btn-success">Xuất ra Excel</button>
        </div>
    </div>
</body>
</html>
